# Alembic config for the backend's schema migrations (ADR-006).
# The database URL comes from reservations.config (DATABASE_URL), not from
# this file, so the CLI and the app can never point at different databases.
#
#   uv run alembic upgrade head        # apply pending migrations
#   uv run alembic revision --autogenerate -m "add x"   # draft a new one, then review it by hand
[alembic]
script_location = %(here)s/src/reservations/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
